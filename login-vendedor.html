<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login do Vendedor | Minha Loja</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#0f172a,#1e3a8a);color:#0f172a}.card{width:100%;max-width:430px;background:#fff;border-radius:24px;padding:32px;box-shadow:0 25px 70px rgba(0,0,0,.3)}.logo{width:64px;height:64px;margin:0 auto 16px;border-radius:18px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#2563eb,#7c3aed);font-size:30px}.brand{text-align:center}.brand h1{margin:0;font-size:26px}.brand p{margin:8px 0 26px;color:#64748b;font-size:13px;line-height:1.5}.campo{margin-bottom:16px}.campo label{display:block;margin-bottom:7px;font-size:13px;font-weight:800}.campo input{width:100%;height:50px;padding:0 14px;border:1px solid #dbe2ea;border-radius:12px;outline:none;font-size:14px}.campo input:focus{border-color:#2563eb;box-shadow:0 0 0 4px rgba(37,99,235,.1)}.senha-wrap{position:relative}.senha-wrap input{padding-right:52px}.mostrar{position:absolute;right:8px;top:7px;width:36px;height:36px;border:0;border-radius:9px;background:#f1f5f9;cursor:pointer}.btn{width:100%;height:50px;border:0;border-radius:12px;background:#2563eb;color:#fff;font-size:14px;font-weight:800;cursor:pointer}.btn:disabled{opacity:.6;cursor:not-allowed}.msg{display:none;margin:14px 0;padding:12px;border-radius:10px;font-size:12px;font-weight:700;line-height:1.5;white-space:pre-wrap}.msg.erro{display:block;background:#fee2e2;color:#991b1b}.msg.ok{display:block;background:#dcfce7;color:#166534}.aux{margin-top:14px;text-align:center}.aux button{border:0;background:none;color:#2563eb;font-weight:700;cursor:pointer}.seg{margin-top:22px;padding:12px;border-radius:11px;background:#f8fafc;color:#64748b;font-size:11px;line-height:1.5;text-align:center}.voltar{display:block;margin-top:16px;text-align:center;color:#2563eb;text-decoration:none;font-size:12px;font-weight:700}

.msg.erro{border:1px solid #fecaca}
</style>
</head>
<body>
<div class="card">
  <div class="logo">🛒</div>
  <div class="brand">
    <h1>Central do Vendedor</h1>
    <p>Use seu e-mail e sua senha para entrar na sua Central.</p>
  </div>

  <form id="formLogin">
    <div class="campo">
      <label for="email">E-mail</label>
      <input id="email" type="email" autocomplete="username" placeholder="seu@email.com" required>
    </div>

    <div class="campo">
      <label for="senha">Senha</label>
      <div class="senha-wrap">
        <input id="senha" type="password" autocomplete="current-password" placeholder="Digite sua senha" required>
        <button class="mostrar" type="button" id="btnMostrar" aria-label="Mostrar senha">👁️</button>
      </div>
    </div>

    <div id="mensagem" class="msg"></div>
    <button class="btn" id="btnEntrar" type="submit">🔐 Entrar na Central</button>
  </form>

  <div class="aux">
    <button type="button" id="btnRecuperar">🔑 Esqueci minha senha</button>
  </div>

  <div class="seg">🔒 Login protegido pelo Firebase Authentication.<br>Por segurança, sua senha não é colocada no link.</div>
  <a class="voltar" href="/loja.html">← Voltar para a loja</a>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script>
const firebaseConfig={
  apiKey:"AIzaSyAMG8workhkRJapQm1AHSMOSIPOnSWltpw",
  authDomain:"minha-loja-5477a.firebaseapp.com",
  databaseURL:"https://minha-loja-5477a-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:"minha-loja-5477a",
  storageBucket:"minha-loja-5477a.firebasestorage.app",
  messagingSenderId:"680448342361",
  appId:"1:680448342361:web:e35226b350ac4504d6f448"
};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();
const db=firebase.database();
const emailEl=document.getElementById('email');
const senhaEl=document.getElementById('senha');
const btn=document.getElementById('btnEntrar');
const msg=document.getElementById('mensagem');
const params=new URLSearchParams(location.search);
const vendedorIdUrl=params.get('vendedorId')||'';
const emailUrl=params.get('email')||'';
if(emailUrl) emailEl.value=emailUrl;

function mensagem(texto,tipo='erro'){msg.className='msg '+tipo;msg.textContent=texto;}
function limparMensagem(){msg.className='msg';msg.textContent='';}

document.getElementById('btnMostrar').onclick=()=>{
  senhaEl.type=senhaEl.type==='password'?'text':'password';
  document.getElementById('btnMostrar').textContent=senhaEl.type==='password'?'👁️':'🙈';
};

document.getElementById('formLogin').addEventListener('submit',async e=>{
  e.preventDefault();
  limparMensagem();
  const email=emailEl.value.trim().toLowerCase();
  const senha=senhaEl.value;
  if(!email||!senha){mensagem('Preencha o e-mail e a senha.');return;}
  btn.disabled=true;btn.textContent='⏳ Entrando...';
  try{
    const cred=await auth.signInWithEmailAndPassword(email,senha);
    const token=await cred.user.getIdToken(true);

    // Verifica o cadastro do vendedor antes de liberar a Central.
    // O administrador grava bloqueado + motivoBloqueio no Firebase.
    let vendedor = null;

    if(vendedorIdUrl){
      const snap = await db.ref('vendedores/' + vendedorIdUrl).once('value');
      vendedor = snap.val();
    }

    if(!vendedor){
      const snap = await db.ref('vendedores')
        .orderByChild('email')
        .equalTo(email)
        .once('value');

      if(snap.exists()){
        const dados = snap.val() || {};
        const primeiroId = Object.keys(dados)[0];
        vendedor = primeiroId ? {id:primeiroId,...dados[primeiroId]} : null;
      }
    }

    if(vendedor && (vendedor.bloqueado === true || vendedor.banido === true || String(vendedor.status || '').toLowerCase() === 'bloqueado')){
      const motivo = String(vendedor.motivoBloqueio || vendedor.motivoBloqueado || '').trim();
      const mensagemBloqueio = motivo
        ? `🚫 Acesso bloqueado.\n\nMotivo do bloqueio:\n${motivo}`
        : '🚫 Seu acesso está bloqueado pelo administrador.';
      throw new Error(mensagemBloqueio);
    }

    const resposta=await fetch('/api/login-vendedor',{
      method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
      body:JSON.stringify({email,senha,vendedorId:vendedorIdUrl})
    });
    const data=await resposta.json().catch(()=>({}));
    if(!resposta.ok||!data.sucesso) throw new Error(data.erro||'Não foi possível validar o acesso do vendedor.');

    localStorage.setItem('firebaseToken',token);
    localStorage.setItem('idToken',token);
    localStorage.setItem('usuarioId',cred.user.uid);
    localStorage.setItem('vendedorId',data.vendedorId);
    localStorage.setItem('emailVendedor',data.email||email);
    localStorage.setItem('nomeVendedor',data.nome||'Vendedor');
    localStorage.setItem('loginVendedorAtivo','true');

    location.replace(data.redirect||('/central-do-vendedor?vendedorId='+encodeURIComponent(data.vendedorId)));
  }catch(error){
    console.error(error);
    try{await auth.signOut();}catch{}
    const c=String(error.code||'');
    mensagem(c.includes('invalid-credential')||c.includes('wrong-password')||c.includes('user-not-found')||error.message==='E-mail ou senha inválidos.'?'E-mail ou senha incorretos.':(error.message||'Não foi possível fazer login.'));
    btn.disabled=false;btn.textContent='🔐 Entrar na Central';
  }
});

document.getElementById('btnRecuperar').onclick=async()=>{
  limparMensagem();
  const email=emailEl.value.trim().toLowerCase();
  if(!email){mensagem('Digite seu e-mail primeiro.');emailEl.focus();return;}
  try{await auth.sendPasswordResetEmail(email);mensagem('✅ Enviamos um link para redefinir sua senha.','ok');}
  catch(error){console.error(error);mensagem('Não foi possível enviar a recuperação. Confira o e-mail.');}
};
</script>
</body>
</html>
